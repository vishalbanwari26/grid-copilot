# CPU-based autoscaling. Note: a local `kind` cluster has no metrics-server by
# default, so this manifest applies cleanly but is not verified to actually
# scale anything without one installed separately.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grid-copilot
  namespace: grid-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grid-copilot
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
