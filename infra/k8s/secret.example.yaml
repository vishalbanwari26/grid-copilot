# Documents the shape of the secret the Deployment expects. Do not apply this
# file as-is (no real values here). Create the real one with, e.g.:
#
#   kubectl create secret generic grid-copilot-secrets \
#     --namespace grid-copilot \
#     --from-literal=GROQ_API_KEY=<your-key> \
#     --from-literal=LANGFUSE_PUBLIC_KEY=<your-key> \
#     --from-literal=LANGFUSE_SECRET_KEY=<your-key>
#
# GROQ_API_KEY is only needed if you run a live provider; the offline mock
# (the CLI/eval default's --provider mock path) needs no key at all. Langfuse
# keys are only needed if you want traces sent somewhere real, rather than a
# NullTracer no-op.
apiVersion: v1
kind: Secret
metadata:
  name: grid-copilot-secrets
  namespace: grid-copilot
type: Opaque
stringData:
  GROQ_API_KEY: "CHANGEME"
  LANGFUSE_PUBLIC_KEY: "CHANGEME"
  LANGFUSE_SECRET_KEY: "CHANGEME"
