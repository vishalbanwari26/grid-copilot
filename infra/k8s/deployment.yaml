apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-copilot
  namespace: grid-copilot
  labels:
    app: grid-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grid-copilot
  template:
    metadata:
      labels:
        app: grid-copilot
    spec:
      containers:
        - name: api
          image: grid-copilot:latest
          # kind clusters do not pull from a registry by default; the image
          # must be loaded in with `kind load docker-image grid-copilot:latest`.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: grid-copilot-config
            - secretRef:
                name: grid-copilot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
